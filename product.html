<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFAMIEE Collection | เลือกซื้อแหวนพรีเมียม ทอง เงิน เพชร</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="nav-header">
      <a href="index.html" class="brand-logo">FIFA</a>
      <a href="index.html" class="btn btn-secondary">กลับหน้าแรก</a>
    </header>

    <h2 style="text-align: center; margin-bottom: 0.5rem;">คอลเลกชันแหวนทั้งหมด</h2>
    <p style="text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 0.95rem;">เลือกแหวนที่ใช่ ตอบโจทย์ทุกช่วงเวลาสำคัญในแบบของคุณ</p>
    
    <div id="filter-bar">
      <button data-mood="all">ทั้งหมด</button>
      <button data-mood="gold">Gold (ทองคำแท้)</button>
      <button data-mood="silver">Silver (เงินแท้)</button>
      <button data-mood="diamond">Diamond (เพชร)</button>
      <button data-mood="couple">Couple (แหวนคู่)</button>
    </div>

    <div id="product-list" class="product-grid"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
